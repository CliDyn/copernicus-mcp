[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copernicus-mcp"
description = "MCP server for safe, validated, cost-aware access to Copernicus Earth observation data."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Ivan Kuznetsov" },
    { name = "CliDyn" },
]
dynamic = ["version"]
dependencies = [
    "mcp>=1.27.0,<1.28",
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "pyyaml>=6,<7",
    "typer>=0.12,<1",
    "rich>=13,<14",
    "aiosqlite>=0.20,<1",
    "python-dateutil>=2.8,<3",
    "pandas>=2,<3",
    "pyarrow>=14,<22",
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
]
cmems = ["copernicusmarine>=2.4,<3"]
cds = ["cdsapi>=0.7.7,<1"]
all = ["copernicus-mcp[cmems,cds]"]

[project.scripts]
copernicus-mcp = "copernicus_mcp.cli:app"

[tool.hatch.version]
path = "src/copernicus_mcp/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/copernicus_mcp"]

[tool.hatch.build.targets.sdist]
# Ship ONLY the source tree, packaging metadata, README and LICENSE.
# Internal docs, research notes, plans, spikes, IDE config and
# example dotenv files do not belong on PyPI.
include = [
    "/src/copernicus_mcp/**",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

# Typer's standard pattern uses ``typer.Option(...)`` / ``typer.Argument(...)``
# as parameter defaults. They're idempotent option-spec objects, not
# mutable defaults — exempt them from B008. Existing call sites work
# only because B008's old heuristic skipped them; explicit ignore makes
# the intent durable across ruff versions.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
